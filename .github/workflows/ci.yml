name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  migrations:
    name: Migrations — apply against real SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # D1 is SQLite. Applying every migration to an in-memory database catches
      # a syntax error, a bad reference or a dead CHECK before `wrangler d1
      # execute` does — on tables nobody can afford to get wrong twice.
      - run: npm run lint:sql

  workers:
    name: Workers — wrangler config is valid
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mcp, api, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `--dry-run` builds and validates bindings without deploying and without
      # needing an API token.
      # A binding declared in wrangler.toml but not exported from the entrypoint
      # fails `deploy` outright, so this catches it at PR time rather than at
      # deploy time. The `database_id` placeholders do not affect a dry run.
      - run: npx wrangler deploy --dry-run --config apps/${{ matrix.app }}/wrangler.toml
