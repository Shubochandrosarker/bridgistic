name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  mcp-server:
    name: MCP server — build + evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridgistic-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test

  plugin-lint:
    name: Plugin — PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP syntax check
        run: find bridgistic -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
