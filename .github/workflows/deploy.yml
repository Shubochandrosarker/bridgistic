name: Deploy

# Deploys are manual until the four hard gates in docs/HARD-GATES.md are green.
# A platform that holds a root-equivalent credential for every connected site
# does not get a push-to-deploy pipeline before it has been reviewed.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which Worker to deploy
        required: true
        type: choice
        options: [mcp, api, scheduler]
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:sql
      - name: Deploy
        run: npx wrangler deploy --config apps/${{ inputs.app }}/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
