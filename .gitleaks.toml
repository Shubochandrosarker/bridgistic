# gitleaks configuration.
#
# The default rules are inherited in full. This file exists to add ONE narrow
# allowlist, and the narrowness is the point: a secret scanner that has been
# broadly suppressed is worse than no scanner, because it produces a green
# check that nobody re-examines.
#
# Every entry here must name an exact path, say why, and be removable by
# deleting the file it points at.

[extend]
useDefault = true

[[rules]]
# Bridgistic's own API key format, so a leaked one is caught in a public commit
# the way GitHub catches a leaked GitHub token. The default rules do not know
# this prefix. See packages/identity/src/api-key.ts — the prefix exists so that
# scanners can recognise it, and this is the rule that makes that true here.
id = "bridgistic-api-key"
description = "Bridgistic API key"
regex = '''brg_(live|test)_[a-z2-9]{8}_[a-z2-9]{24}'''
keywords = ["brg_live_", "brg_test_"]

[rules.allowlist]
# The tests need to construct well-formed keys to check that parsing and
# verification reject the wrong ones. Those are generated at run time from
# crypto.getRandomValues and never leave the process.
paths = ['''packages/identity/test/.*\.test\.ts''']

[allowlist]
description = "Test fixtures that are ciphertext by construction"

paths = [
  # AES-256-GCM envelopes generated by the pinned engine's own crypto.ts, so
  # that packages/crypto can prove it still decrypts what is already stored in
  # the tenants table. They are base64 ciphertext, which is high-entropy by
  # definition and indistinguishable from a credential to any scanner.
  #
  # The key that sealed them is the literal string
  # "bridgistic-test-key-never-real!!", stored as readable text in that file
  # rather than base64 precisely so a person reading the diff can see it is
  # not real. It has never sealed anything.
  #
  # Delete packages/crypto and this entry becomes dead — check-placeholders
  # does not police this file, so removing the fixture means removing this too.
  '''packages/crypto/test/engine-fixtures\.json''',
]

# CI scans history, not just the working tree, so a literal that has since been
# rewritten is still present in an earlier commit. This allowlists the exact
# string — not the file — because it is a fixed, deliberately-malformed
# envelope used to prove `isEnvelope` rejects it, and it is 20 characters long.
# Matching on the value keeps the scanner live on every other line of that file.
regexes = [
  '''v2\.aes256gcm\.short\.x''',
]
